<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="context-bench loop: Case times Profile, then a blind Judge, then KEEP, PROMPT_BLOAT, or REMOVE">
  <rect width="1200" height="420" fill="#0b0d10"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#e8a54b" font-size="16" letter-spacing="3">HOW IT SCORES</text>

    <rect x="40" y="80" width="240" height="140" rx="10" fill="#15181e" stroke="#2a3038"/>
    <text x="160" y="138" text-anchor="middle" fill="#f4f0e6" font-size="28" font-weight="700">Case</text>
    <text x="160" y="172" text-anchor="middle" fill="#9aa3ad" font-size="15">fixed prompt + rubric</text>

    <text x="300" y="164" fill="#e8a54b" font-size="28" font-weight="700">×</text>

    <rect x="340" y="80" width="300" height="140" rx="10" fill="#15181e" stroke="#2a3038"/>
    <text x="490" y="128" text-anchor="middle" fill="#f4f0e6" font-size="28" font-weight="700">Profile</text>
    <text x="490" y="162" text-anchor="middle" fill="#9aa3ad" font-size="15">model + bare</text>
    <text x="490" y="184" text-anchor="middle" fill="#9aa3ad" font-size="15">or model + your dir</text>

    <text x="660" y="164" fill="#6b7380" font-size="28">→</text>

    <rect x="700" y="80" width="220" height="140" rx="10" fill="#15181e" stroke="#2a3038"/>
    <text x="810" y="138" text-anchor="middle" fill="#f4f0e6" font-size="28" font-weight="700">Blind judge</text>
    <text x="810" y="172" text-anchor="middle" fill="#9aa3ad" font-size="15">never sees the Profile</text>

    <text x="940" y="164" fill="#6b7380" font-size="28">→</text>

    <rect x="980" y="80" width="180" height="140" rx="10" fill="#15181e" stroke="#2a3038"/>
    <text x="1070" y="138" text-anchor="middle" fill="#f4f0e6" font-size="28" font-weight="700">Delta</text>
    <text x="1070" y="172" text-anchor="middle" fill="#9aa3ad" font-size="15">bundle − bare</text>

    <rect x="40" y="268" width="340" height="100" rx="10" fill="#102018" stroke="#2e5a40"/>
    <text x="210" y="314" text-anchor="middle" fill="#7dcea0" font-size="26" font-weight="700">KEEP</text>
    <text x="210" y="344" text-anchor="middle" fill="#9aa3ad" font-size="15">Δ ≥ +1.5 — it earns tokens</text>

    <rect x="430" y="268" width="340" height="100" rx="10" fill="#1c160c" stroke="#6a4a1e"/>
    <text x="600" y="314" text-anchor="middle" fill="#e8a54b" font-size="26" font-weight="700">PROMPT_BLOAT</text>
    <text x="600" y="344" text-anchor="middle" fill="#9aa3ad" font-size="15">in between — probably not</text>

    <rect x="820" y="268" width="340" height="100" rx="10" fill="#1c1010" stroke="#6a2a28"/>
    <text x="990" y="314" text-anchor="middle" fill="#d94b3d" font-size="26" font-weight="700">REMOVE</text>
    <text x="990" y="344" text-anchor="middle" fill="#9aa3ad" font-size="15">Δ ≤ −1.0 — it made it worse</text>
  </g>
</svg>
