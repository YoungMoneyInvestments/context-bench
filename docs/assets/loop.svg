<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Each pile of extra context is tested with the same model twice: with it, and without it. Helps means the model scored better. No lift means almost the same. Hurts means the model scored worse.">
  <rect width="1200" height="700" fill="#0b0d10"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="44" fill="#e8a54b" font-size="14" letter-spacing="2.5">HOW TO READ THIS</text>
    <text x="48" y="86" fill="#f4f0e6" font-size="30" font-weight="700">Did the extra context help, or get in the way?</text>
    <text x="48" y="122" fill="#9aa3ad" font-size="17">Same model, twice: once with that pile attached, once without. The word is what changed.</text>

    <!-- header -->
    <text x="64" y="172" fill="#6b7380" font-size="13" letter-spacing="1">THE PILE</text>
    <text x="400" y="172" fill="#6b7380" font-size="13" letter-spacing="1">WEAKER MODEL</text>
    <text x="640" y="172" fill="#6b7380" font-size="13" letter-spacing="1">STRONGER MODEL</text>
    <text x="880" y="172" fill="#6b7380" font-size="13" letter-spacing="1">WHAT YOU SHOULD DO</text>

    <!-- CLAUDE.md -->
    <rect x="40" y="188" width="1120" height="88" rx="12" fill="#15181e"/>
    <text x="64" y="226" fill="#f4f0e6" font-size="20" font-weight="700">Your house rules</text>
    <text x="64" y="250" fill="#6b7380" font-size="14">CLAUDE.md / AGENTS.md</text>
    <rect x="384" y="214" width="120" height="36" rx="8" fill="#1c160c" stroke="#6a4a1e"/>
    <text x="444" y="238" text-anchor="middle" fill="#e8a54b" font-size="16" font-weight="700">No lift</text>
    <rect x="624" y="214" width="120" height="36" rx="8" fill="#1c1010" stroke="#6a2a28"/>
    <text x="684" y="238" text-anchor="middle" fill="#d94b3d" font-size="16" font-weight="700">Hurts</text>
    <text x="880" y="240" fill="#f4f0e6" font-size="16">Drop it when you upgrade</text>

    <!-- skills -->
    <rect x="40" y="288" width="1120" height="88" rx="12" fill="#15181e"/>
    <text x="64" y="326" fill="#f4f0e6" font-size="20" font-weight="700">Your skills</text>
    <text x="64" y="350" fill="#6b7380" font-size="14">slash commands, playbooks</text>
    <rect x="384" y="314" width="120" height="36" rx="8" fill="#102018" stroke="#2e5a40"/>
    <text x="444" y="338" text-anchor="middle" fill="#7dcea0" font-size="16" font-weight="700">Helps</text>
    <rect x="624" y="314" width="120" height="36" rx="8" fill="#1c160c" stroke="#6a4a1e"/>
    <text x="684" y="338" text-anchor="middle" fill="#e8a54b" font-size="16" font-weight="700">No lift</text>
    <text x="880" y="330" fill="#f4f0e6" font-size="16">Leave it for now</text>
    <text x="880" y="352" fill="#9aa3ad" font-size="14">stronger models need it less</text>

    <!-- hooks -->
    <rect x="40" y="388" width="1120" height="88" rx="12" fill="#15181e"/>
    <text x="64" y="426" fill="#f4f0e6" font-size="20" font-weight="700">Your hooks</text>
    <text x="64" y="450" fill="#6b7380" font-size="14">reminders that fire on every turn</text>
    <rect x="384" y="414" width="120" height="36" rx="8" fill="#1c160c" stroke="#6a4a1e"/>
    <text x="444" y="438" text-anchor="middle" fill="#e8a54b" font-size="16" font-weight="700">No lift</text>
    <rect x="624" y="414" width="120" height="36" rx="8" fill="#1c1010" stroke="#6a2a28"/>
    <text x="684" y="438" text-anchor="middle" fill="#d94b3d" font-size="16" font-weight="700">Hurts</text>
    <text x="880" y="440" fill="#f4f0e6" font-size="16">Take this out</text>

    <!-- key -->
    <rect x="40" y="500" width="360" height="86" rx="12" fill="#12151a"/>
    <text x="60" y="528" fill="#7dcea0" font-size="16" font-weight="700">Helps</text>
    <text x="60" y="552" fill="#9aa3ad" font-size="14">Scored better with it.</text>
    <text x="60" y="572" fill="#9aa3ad" font-size="14">Leave it.</text>

    <rect x="416" y="500" width="360" height="86" rx="12" fill="#12151a"/>
    <text x="436" y="528" fill="#e8a54b" font-size="16" font-weight="700">No lift</text>
    <text x="436" y="552" fill="#9aa3ad" font-size="14">Almost the same either way.</text>
    <text x="436" y="572" fill="#9aa3ad" font-size="14">Paying tokens for little.</text>

    <rect x="792" y="500" width="368" height="86" rx="12" fill="#12151a"/>
    <text x="812" y="528" fill="#d94b3d" font-size="16" font-weight="700">Hurts</text>
    <text x="812" y="552" fill="#9aa3ad" font-size="14">Scored worse with it.</text>
    <text x="812" y="572" fill="#9aa3ad" font-size="14">Take it out.</text>

    <text x="48" y="628" fill="#6b7380" font-size="14">This picture is a made-up example so you can read the shape. Your real table is the dashboard after a run.</text>
    <text x="48" y="656" fill="#6b7380" font-size="14">Read left to right: if it helps a weaker model and hurts a stronger one, delete that pile when you upgrade.</text>
  </g>
</svg>
